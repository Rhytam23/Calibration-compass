services:
  - type: web
    name: calibrationcompass-api
    runtime: python
    plan: starter
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: IBM_QUANTUM_TOKEN
        sync: false
      - key: IBM_INSTANCE
        value: open-instance
      - key: ALLOWED_ORIGINS
        sync: false
      - key: API_KEY
        sync: false
      - key: RATE_LIMIT_PER_MIN
        value: "6"
