name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            server/requirements.txt
      - run: pip install -r requirements.txt -r server/requirements.txt pyflakes httpx
      - name: Compile all scripts
        run: python -m compileall -q server experiments *.py
      - name: Lint for undefined names
        run: python -m pyflakes server | grep -v "imported but unused" || true
      - name: Server smoke test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import server.app as app
          c = TestClient(app.app)
          assert c.get("/health").json() == {"status": "ok"}
          assert c.post("/analyze", json={"qasm": "garbage"}).status_code in (400, 503)
          PY
